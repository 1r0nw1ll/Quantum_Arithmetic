# QA Task Schema v4.0
# Defines the structure for task definitions in tasks/*.yaml

id: "T-001"  # Unique task identifier
project: "PRJ-001"  # Associated project ID (optional)

title: "Brief, descriptive task title"
description: "Detailed explanation of what needs to be done"

source: "scout(commit:abc123)"  # How this task was discovered
touches_invariants: []  # List of invariants affected: ["J=b·d", "inner_ellipse"]

state: "queued"  # queued, active, completed, cancelled
lane: "green"  # green, yellow, red (approval requirements)

assignee: "auto"  # auto, claude_code, gemini_cli, codex, manual
priority: 0.0  # Computed WSJF score

estimates:
  effort: 2  # 1-5 scale
  uncertainty: 1  # 1-4 scale

impact:
  user_value: 4  # 1-5: blocks core usage, enables demos
  proof_impact: 5  # 1-5: tightens key theorems
  risk_reduction: 3  # 0-4: security, stability
  deadline_weight: 2  # 0-6: date-based urgency

plan:
  steps:
    - description: "Step 1 description"
      acceptance: "How to verify completion"
      tools: ["pytest", "git"]
      effort: "2 hours"
  risks:
    - "Potential issue and mitigation"
  dependencies:
    - "T-000"  # Other task IDs

execution:
  branch: "task/T-001"  # Git branch created
  started_at: "2025-10-29T18:00:00Z"
  completed_at: null
  pr_url: null

review:
  approved: null  # true, false, null
  reviewer: null  # agent or human
  feedback: null  # review comments

metadata:
  created_at: "2025-10-29T17:30:00Z"
  updated_at: "2025-10-29T18:00:00Z"
  version: "4.0"